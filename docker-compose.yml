# ELV ALC Dashboard — Docker Compose
#
# Simulator (default):
#   docker compose up --build
#   → http://127.0.0.1:8080
#
# Real device (Linux host): uncomment devices + group_add, set simulator: false
# and serial_port in config.yaml (e.g. /dev/elv-alc).

services:
  alc:
    build: .
    image: elv-alc-dashboard:local
    container_name: elv-alc-dashboard
    ports:
      - "8080:8080"
    volumes:
      # Persist settings and archives on the host
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    # --- Hardware (Linux only) — uncomment and adjust path ---
    # devices:
    #   - /dev/elv-alc:/dev/elv-alc
    #   # or: /dev/ttyUSB0:/dev/ttyUSB0
    # group_add:
    #   - dialout
    restart: unless-stopped
